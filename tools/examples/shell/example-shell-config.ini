# ND-100X Interactive Shell Configuration Example
# Save this as: nd100x-shell.ini
# Run with: ./build/bin/nd100x --config=nd100x-shell.ini

[cpu]
type = 100

[peripheral.papertape-reader]
enabled = yes

[peripheral.papertape-punch]
enabled = yes

[peripheral.lineprinter]
enabled = yes

[boot]
device = smd.0.0

[runtime]
# Enable interactive shell mode
shell = on

# Point to your BPUN files directory
# Can be any path: absolute or relative
# Examples:
#   nd100_root = /path/to/bpun
#   nd100_root = ./examples
#   nd100_root = /tmp/nd100-programs
# Default (empty): current working directory (.)
nd100_root = /path/to/bpun

# Optional: auto-run commands from script file
# script = /tmp/autorun.sh
# If not set, shell starts in interactive mode

# Other optional settings
telnet = 0
debugger = 0
trace = off
memory = 4
