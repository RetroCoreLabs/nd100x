# =====================================================================
# example-shell-config.ini - the interactive shell (monitor) mode
# =====================================================================
# WHAT THIS IS
#   A machine INI that starts nd100x in its interactive shell instead of
#   booting a disc. The shell lists BPUN/PROG files in a directory, loads
#   one into memory and shows the CPU registers. It is for trying
#   stand-alone programs without SINTRAN.
#
# HOW TO RUN IT (from the repo root)
#   ./build/bin/nd100x --config=tools/examples/shell/example-shell-config.ini
#
#   Then at the shell prompt:  HELP, LIST-FILES *.bpun, RUN-PROGRAM x.bpun,
#   SHOW-REGISTERS, EXIT. Commands may be abbreviated (LI-FI, RU-PR, SH-RE).
#   The same without an INI:  ./build/bin/nd100x --monitor --nd100-root=DIR
#
# HOW THIS FILE WORKS
#   * Lines starting with '#' or ';' are comments.
#   * Section names and keys are case-insensitive. An unknown section or
#     key stops the load with an error that names the line.
#   * Loading any INI starts from a machine with no controllers; this file
#     adds none, so the machine here is CPU, clock, console and the three
#     paper peripherals.
#   * A command-line flag wins over the key here that means the same thing.
# =====================================================================


# ---------------------------------------------------------------------
# CPU / base machine
# ---------------------------------------------------------------------
# cpu = 100 | 110 | 120, or a model name such as ND110CX (same as
# --cputype). Other keys: mms (1|2), fpp (32|48), rtc (wall|ticks).
[machine]
cpu = 100


# ---------------------------------------------------------------------
# Peripherals
# ---------------------------------------------------------------------
# Paper tape reader (IOX 400-403), paper tape punch (IOX 410-413) and line
# printer (IOX 430-433).
[peripheral.papertape-reader]
enabled = yes

[peripheral.papertape-punch]
enabled = yes

[peripheral.lineprinter]
enabled = yes


# ---------------------------------------------------------------------
# Boot
# ---------------------------------------------------------------------
# No disc controller is configured, so no disc boot is possible. "none"
# powers the machine on with nothing loaded and the CPU at 0; the shell
# then loads programs itself.
[boot]
device = none


# ---------------------------------------------------------------------
# Runtime options (a command-line flag overrides each)
# ---------------------------------------------------------------------
# shell      - on: start the interactive shell (same as --monitor/--shell).
# nd100_root - directory the shell lists and loads BPUN/PROG files from
#              (same as --nd100-root). Relative paths are relative to the
#              directory nd100x is started from; "." is the default.
# script     - a file of shell commands to run at start-up (same as
#              --script); see example-shell-commands.sh next to this file.
#              Left out, the shell starts interactively.
# memory     - installed main memory in MB, 1 to 16 (same as --memory).
# telnet, debugger - ports for the telnet server and the DAP debugger;
#              0 or left out = not started.
# trace      - on: CPU execution trace to stderr (same as --trace).
[runtime]
shell = on
nd100_root = ./bpun
# script = tools/examples/shell/example-shell-commands.sh
memory = 4
telnet = 0
debugger = 0
trace = off
