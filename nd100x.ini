# =====================================================================
# nd100x.ini - ND-100 machine configuration
# =====================================================================
# This file describes the emulated machine: which CPU, which controllers
# and disks, what to boot, and default runtime options.
#
# HOW IT IS FOUND
#   The binary loads the INI named after itself in the current directory:
#     nd100x  -> nd100x.ini      nd110x -> nd110x.ini
#   Override with:  nd100x --config mymachine.ini
#   With no INI at all, the built-in defaults match this file.
#
# HOW TO EDIT
#   * Lines starting with '#' or ';' are comments.
#   * Turn a device on/off with:  enabled = yes   (or: no)
#   * Keys are case-insensitive.  Section names are  [type.thumbwheel].
#   * The same controller+thumbwheel may appear only once.
#
# NOTE: ident codes are chosen by the hardware from the thumbwheel; they
# are never set here.
# =====================================================================


# ---------------------------------------------------------------------
# CPU / base machine
# ---------------------------------------------------------------------
# The CPU, the real-time clock (RTC) and the console terminal are always
# present and cannot be disabled.
[machine]
cpu = 100                 ; 100 | 110 | 120   (default 100)


# ---------------------------------------------------------------------
# Disc controllers
# ---------------------------------------------------------------------

# Floppy (DMA), thumbwheel 0. Units 0-2.
[controller.floppy.0]
enabled = yes
disk0 = FLOPPY.IMG
# disk1 =
# disk2 =

# SMD hard disk, thumbwheel 0. Units 0-3.
[controller.smd.0]
enabled = yes
disk0 = SMD0.IMG          ; unit 0 (usual boot unit)
# disk1 = SMD1.IMG
# disk2 = SMD2.IMG
# disk3 = SMD3.IMG

# SCSI (ND-3201/3204), thumbwheels 0-3. IDs 0-6 (ID 7 = controller).
# Each disk is  [media:]path  where media = hdd | cdrom | tape | floppy.
# Only 'hdd' is implemented today; hdd is the default when media is omitted.
[controller.scsi.0]
enabled = yes
disk0 = hdd:SCSI0.IMG     ; SCSI ID 0  (point this at your SCSI image)
# disk1 = hdd:SCSI1.IMG
# disk2 = hdd:SCSI2.IMG
# disk3 = cdrom:cd.iso    ; (cdrom not implemented yet)
# disk4 =
# disk5 =
# disk6 =

# A second SCSI controller would go on another thumbwheel, e.g.:
# [controller.scsi.1]
# enabled = no
# disk0 = hdd:PACK2.IMG


# ---------------------------------------------------------------------
# Network controllers
# ---------------------------------------------------------------------

# HDLC, thumbwheels 1-4. Disabled by default.
#   mode = server   -> listen on 'port'
#   mode = client   -> connect to 'host':'port'
[controller.hdlc.1]
enabled = no
mode = server
port = 5000
# host = 192.168.1.10   ; only for mode = client

[controller.hdlc.2]
enabled = no
mode = client
host = 192.168.1.10
port = 5001


# ---------------------------------------------------------------------
# Terminals
# ---------------------------------------------------------------------
# Terminal 0 is the console and is always present. Additional terminals
# match today's default set. Edit the list to add/remove.
[terminals]
enabled = 5, 6, 7, 8, 9, 10, 11


# ---------------------------------------------------------------------
# Peripherals (default on; disable if you don't need them)
# ---------------------------------------------------------------------
[peripheral.papertape-reader]
enabled = yes

[peripheral.papertape-punch]
enabled = yes

[peripheral.lineprinter]
enabled = yes
# type = text            ; text | escp
# format = txt           ; txt | pdf


# ---------------------------------------------------------------------
# Boot
# ---------------------------------------------------------------------
# device = <type>.<thumbwheel>.<unit>   e.g. smd.0.0, scsi.0.0, floppy.0.0
# Non-disc boots keep a file form:      bpun:FILE  or  aout:FILE
[boot]
#device = smd.0.0
device = floppy.0.0

# ---------------------------------------------------------------------
# Runtime options (non-hardware; a command-line flag overrides these)
# ---------------------------------------------------------------------
[runtime]
# telnet = 9000          ; enable telnet server on this port
# throttle = 0.5275      ; MHz real-time throttle (omit = full speed)
# charset = off          ; off | norwegian | swedish | german  (local console)
# printdir = ./prints
# tapedir = ./tapes
# debugger = 6661        ; enable DAP debugger on this port
# trace = off

[mfbus]
size      = 2
base_page = 04000B

[controller.octobus.0]
enabled = yes

[nd5000.1]
enabled = yes
station = 070B

