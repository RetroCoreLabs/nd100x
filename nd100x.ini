# =====================================================================
# nd100x.ini - the default machine
# =====================================================================
# WHAT THIS MACHINE IS
#   An ND-100 with a floppy, an SMD disc and a SCSI disc on thumbwheel 0,
#   two HDLC links (present in the file, switched off), the paper tape
#   reader and punch, a line printer, and on top of that the three pieces
#   of an ND-5000: the MFbus shared memory pool, the octobus card and one
#   ND-5000 CPU in slot 1. It boots from the floppy.
#
# HOW IT IS FOUND
#   With no --config, the binary loads the INI named after itself from the
#   CURRENT directory: nd100x reads nd100x.ini, nd110x reads nd110x.ini (a
#   trailing .exe is stripped). Another file: nd100x --config FILE.
#   nd100x --show-config prints the machine as it was understood.
#   The machines in config/ are complete examples (config/README.md).
#
#   With no INI at all the built-in defaults apply, and they are SMALLER
#   than this file: floppy, SMD and SCSI on wheel 0 with FLOPPY.IMG,
#   SMD0.IMG and SCSI0.IMG, terminals 5-11, the three peripherals, no
#   HDLC, no MFbus, no octobus, no ND-5000.
#
# PATHS
#   Disc image names are opened relative to the directory nd100x is
#   started from. Disc images are not in the repository; images/ holds
#   compressed copies of some of them.
#
# HOW THIS FILE WORKS
#   * Lines starting with '#' or ';' are comments; ';' also starts a
#     comment after a value.
#   * Section names are [type.thumbwheel]. Keys are case-insensitive. The
#     same controller and thumbwheel may appear only once. An unknown
#     section or key stops the load with an error naming the line.
#   * A controller section with "enabled = yes" puts the card in the
#     machine; "enabled = no" leaves the section in the file but builds
#     nothing. Loading any INI starts from a machine with no controllers.
#   * NAMING A SECTION IS WHAT ENABLES IT for [mfbus], [controller.octobus.0],
#     [nd5000.<n>] and [nd500]: the section header alone switches the
#     hardware on, so deleting or commenting out the section is how it is
#     turned off ("enabled = no" keeps the section but builds nothing).
#   * A command-line flag always wins over the key here that means the
#     same thing (--boot over [boot], --telnet over telnet, and so on).
#   * Ident codes are fixed by the hardware from the thumbwheel; they are
#     never set here.
# =====================================================================


# ---------------------------------------------------------------------
# CPU / base machine
# ---------------------------------------------------------------------
# cpu  - a family number (100, 110, 120) or a model name. Model names the
#        emulator implements: ND100, ND100CE, ND100CX, ND110, ND110CE,
#        ND110CX, ND110PCX, ND120CX. Same as --cputype.
# mms  - paging system: 1 = Paging System I (4 page tables, NORD-10 era,
#        needed by NORD TSS), 2 = MMS-2 (16 page tables, the default,
#        needed by SINTRAN VSX). Same as --mms.
# fpp  - floating point unit width: 48 (the standard 3-word format, the
#        default) or 32 (the optional single-precision unit). Same as --fpp.
# rtc  - real-time clock source: wall (default, 50 Hz of host wall-clock
#        time) or ticks (one pulse per 10550 instructions). Same as --rtc.
# The CPU, the clock and the console terminal are always present.
[machine]
cpu = 100
# mms = 2
# fpp = 48
# rtc = wall


# ---------------------------------------------------------------------
# Disc controllers
# ---------------------------------------------------------------------
# Only thumbwheel 0 exists for floppy, SMD and Winchester; SCSI has
# wheels 0-3. A diskN line mounts an image in unit N; a controller with no
# diskN lines is present with nothing mounted.

# Floppy (DMA controller), IOX 1560-1567. Units: disk0 to disk2. Unit 0
# is what this machine boots; the F12 menu can mount other images.
[controller.floppy.0]
enabled = yes
disk0 = FLOPPY.IMG
# disk1 =
# disk2 =

# SMD (the big disc controller), IOX 1540-1547. Units: disk0 to disk3.
# Boot from it with [boot] device = smd.0.0 or --boot=smd.
[controller.smd.0]
enabled = yes
disk0 = SMD0.IMG          ; unit 0 (the usual boot unit)
# disk1 = SMD1.IMG
# disk2 = SMD2.IMG
# disk3 = SMD3.IMG

# SCSI (ND-3201/3204), thumbwheels 0-3; wheel 0 is IOX 144300-144377.
# Units: disk0 to disk6 (SCSI ID 7 is the controller itself). Each disk is
# [media:]path with media = hdd | cdrom | tape | floppy; only hdd is
# implemented and it is the default when the prefix is left out.
[controller.scsi.0]
enabled = yes
disk0 = hdd:SCSI0.IMG     ; SCSI ID 0 (point this at your SCSI image)
# disk1 = hdd:SCSI1.IMG
# disk2 = hdd:SCSI2.IMG
# disk3 = cdrom:cd.iso    ; (cdrom not implemented yet)
# disk4 =
# disk5 =
# disk6 =

# A second SCSI controller goes on another thumbwheel:
# [controller.scsi.1]
# enabled = no
# disk0 = hdd:PACK2.IMG

# Winchester (ST506 / 8 inch, cards 3041/3038), IOX 500-507, units disk0
# and disk1. Not in this machine; config/nd100-eth.ini boots from one.
# IOX 500 is also where the NORD TSS cartridge disc (CDC) sits, so a
# machine has one of the two, never both.
# [controller.wd.0]
# enabled = yes
# disk0 = WD0.IMG


# ---------------------------------------------------------------------
# Network controllers
# ---------------------------------------------------------------------
# HDLC, thumbwheels 1-4 at IOX 1640, 1660, 1700, 1720 (16 registers
# each). The link runs over TCP:
#   mode = server   listen on 'port' (1-65535)
#   mode = client   connect to 'host' : 'port'
# Both links below are off; set enabled = yes to use one. Same as --hdlc.
[controller.hdlc.1]
enabled = no
mode = server
port = 5000
# host = 192.168.1.10   ; only for mode = client

[controller.hdlc.2]
enabled = no
mode = client
host = 192.168.1.10
port = 5001

# Ethernet II (the 68000-based card), thumbwheels 0-3, wheel 0 at IOX
# 140360-140363. Not in this machine; config/nd100-eth.ini and
# config/nd100-cosmos.ini have it with every key explained.
# [controller.eth.0]
# enabled = yes
# net = tap:nd0


# ---------------------------------------------------------------------
# Terminals
# ---------------------------------------------------------------------
# Terminal numbers are SINTRAN's: terminal 1 is the console (IOX 300) and
# is always present, so it is not listed. Terminals 2-8 sit at IOX 310 to
# 370, terminals 9-16 at IOX 1300 to 1370. This list is the built-in
# default set. The telnet server hands out terminals from it (8-11 by
# default); Alt+1 to Alt+9 switch the local screen between them and the
# F12 menu lists them.
[terminals]
enabled = 5, 6, 7, 8, 9, 10, 11


# ---------------------------------------------------------------------
# Peripherals
# ---------------------------------------------------------------------
# Paper tape reader (IOX 400-403; --tape=FILE loads a BPUN into it),
# paper tape punch (IOX 410-413; output files land in [runtime] tapedir)
# and line printer (IOX 430-433; output files land in [runtime] printdir).
# All three are on by default.
[peripheral.papertape-reader]
enabled = yes

[peripheral.papertape-punch]
enabled = yes

# The printer's type and format keys are read but not yet applied by the
# INI loader; use --printer=text|escp and --printformat=txt|pdf for now.
[peripheral.lineprinter]
enabled = yes
# type = text            ; text | escp   (not applied yet)
# format = txt           ; txt | pdf     (not applied yet)


# ---------------------------------------------------------------------
# Boot
# ---------------------------------------------------------------------
# device = <type>.<thumbwheel>.<unit> for a disc boot: floppy.0.0,
# smd.0.0, scsi.0.0, wd.0.0. Other forms: bpun:FILE (load a BPUN tape
# image into memory and start it), aout:FILE, cdc (the NORD TSS cartridge
# disc's LOAD button, needs [runtime] cdc), none (power on with nothing
# loaded, for the debugger or the shell). --boot and --image override it.
[boot]
#device = smd.0.0
device = floppy.0.0


# ---------------------------------------------------------------------
# Runtime options (not hardware; a command-line flag overrides each)
# ---------------------------------------------------------------------
# telnet     - start the telnet server on this port (same as --telnet).
# throttle   - MHz of real-time throttle (same as --throttle); 0.5275
#              makes the ticks-mode clock exactly 50 Hz. Left out = full
#              speed.
# host_cpu   - low (default): sleep when the machine is idle, little host
#              CPU. full: never sleep, one host core always busy. Same as
#              --host-cpu.
# idle_count - instructions in a row on level 0 with paging and
#              interrupts on (idle SINTRAN) before the 1 ms idle sleep.
#              Lower = less host CPU. Left out = 2000 for a disc boot,
#              50000 for floppy and directly loaded programs; 0 = off.
#              Same as --idle-count.
# charset    - national character set of the local console: off (also
#              none, ascii), no (norwegian, norsk, dk, danish), se
#              (swedish), de (german). Same as --charset.
# printdir   - directory for line printer output files (default ./prints).
# tapedir    - directory for paper tape punch output files (default
#              ./tapes).
# debugger   - start the DAP debugger on this port (same as --debugger).
#              Use a port other than 4711 when another nd100x may be
#              running.
# trace      - on: CPU execution trace to stderr (same as --trace).
# verbose    - on: device list and INFO log lines at start-up (--verbose).
# log        - per-category log levels, same syntax as --log.
# memory     - installed main memory in MB, 1 to 16, default 4 (--memory).
# Also accepted: boot_status (on|off), trace_nd110 (on|off|FILE),
# ring_at_pf / ring_at_clpt (a count, 0 = off), drum and cdc (NORD TSS
# image paths), shell / nd100_root / script (the interactive shell; see
# tools/examples/shell/example-shell-config.ini).
[runtime]
# telnet = 9000
# throttle = 0.5275
# host_cpu = low
# idle_count = 2000
# charset = off
# printdir = ./prints
# tapedir = ./tapes
# debugger = 6661
# trace = off
# verbose = off
# memory = 4


# ---------------------------------------------------------------------
# ND-5000: shared memory, octobus and one CPU
# ---------------------------------------------------------------------
# These three sections give the default machine an ND-5000. Naming a
# section is what adds the hardware; comment all three out for a plain
# ND-100. config/ND5000.ini is the full, commented ND-5000 machine and
# config/tpe.ini runs the TPE diagnostics against one; both use the 8 MB
# pool at page 04100B that was checked against RetroCore. The pool here
# is smaller (2 MB) and sits at page 04000B (byte address 4 MB).

# MFbus shared memory (the MPM5 multiport memory).
# size      - pool size in megabytes, 1 to 2048.
# base_page - the ND-100 page (2 KB pages) at which ND-500 physical
#             address 0 lands; octal with a trailing B. Give the ND-500
#             monitor's DEFINE-MEMORY-CONFIGURATION this same number.
[mfbus]
size      = 2
base_page = 04000B

# The octobus card, the message bus between the ND-100 and the ND-5000
# CPUs. Wheel 0 answers at IOX 100400-100407 with idents 40B (receive)
# and 41B (transmit) on interrupt level 13. The ND-100 is always station
# 1B, so the section's presence is the whole configuration.
[controller.octobus.0]
enabled = yes

# One ND-5000 CPU. <n> in [nd5000.<n>] is the CPU slot, 1 to 4; station
# is its octobus station, 070B to 073B (left out: 070B + slot - 1). The
# other keys (base_page, cpu_type, kernel, pseg, dseg, diskN) are
# explained in config/ND5000.ini.
[nd5000.1]
enabled = yes
station = 070B
