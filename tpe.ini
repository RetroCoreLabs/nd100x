# =====================================================================
# tpe.ini - TPE diagnostic floppy on a machine with an ND-5000 fitted
# =====================================================================
# Boots the ND TPE (Test Program Environment) floppy FLOPPY.IMG and has
# the MFbus shared memory pool, the octobus card and one ND-5000 present,
# so TPE's CONFIGURATION test sees the full ND-5000 machine and not just
# the ND-100 front end.
#
# Run it with:
#   nd100x --config tpe.ini
#
# At the TPE> prompt, CONF selects the CONFIGURATION test and RUN starts
# it. The unattended runner tools/tpe_autorun.py drives the same thing.
#
# Paths are relative to the directory nd100x is started from, which is
# normally the repository root where FLOPPY.IMG lives.
#
# NAMING A SECTION IS WHAT ENABLES IT for [mfbus], [controller.octobus.0]
# and [nd5000.<n>] - the presence of the section switches the hardware on,
# so deleting or commenting out a section is how it is turned off.
#
# Ident codes are chosen by the hardware from the thumbwheel and are never
# set here.
# =====================================================================


# ---------------------------------------------------------------------
# CPU / base machine
# ---------------------------------------------------------------------
# The CPU, the real-time clock and the console terminal are always
# present and cannot be disabled.
[machine]
cpu = 100                 ; 100 | 110 | 120


# ---------------------------------------------------------------------
# Disc controllers
# ---------------------------------------------------------------------

# Floppy (DMA), thumbwheel 0. Units 0-2. Unit 0 holds the TPE floppy and
# is what this machine boots. The controller answers IOX 1560-1567.
[controller.floppy.0]
enabled = yes
disk0 = FLOPPY.IMG        ; unit 0 - the TPE diagnostic floppy
# disk1 =
# disk2 =

# SMD hard disk, thumbwheel 0. Units 0-3. Present so TPE's CONFIGURATION
# test finds the controller at IOX 1540-1547.
[controller.smd.0]
enabled = yes
disk0 = SMD0.IMG

# SCSI (ND-3201/3204), thumbwheel 0. IDs 0-6; ID 7 is the controller.
# Each disk is  [media:]path  where media = hdd | cdrom | tape | floppy.
# Only hdd is implemented, and it is the default when media is omitted.
[controller.scsi.0]
enabled = yes
disk0 = hdd:SCSI0.IMG


# ---------------------------------------------------------------------
# Terminals
# ---------------------------------------------------------------------
# Terminal 0 is the console and is always present.
[terminals]
enabled = 5, 6, 7, 8, 9, 10, 11


# ---------------------------------------------------------------------
# Peripherals
# ---------------------------------------------------------------------
[peripheral.papertape-reader]
enabled = yes

[peripheral.papertape-punch]
enabled = yes

[peripheral.lineprinter]
enabled = yes


# ---------------------------------------------------------------------
# Boot
# ---------------------------------------------------------------------
# device = <type>.<thumbwheel>.<unit>, so floppy.0.0 is the TPE floppy.
[boot]
device = floppy.0.0


# ---------------------------------------------------------------------
# MFbus shared memory (MPM5)
# ---------------------------------------------------------------------
# size      - pool size in megabytes.
# base_page - the ND-100 page at which ND-500 physical address 0 lands.
#             Give the ND-500 monitor's DEFINE-MEMORY-CONFIGURATION this
#             same number. 04100B matches RetroCore, whose working MEM-CONF
#             reports "ND-500 address zero: ND-100 page 004100" and ND-100
#             word 00010200000B (2112 * 1024). It leaves bank 32 unbacked -
#             a 128 KB hole visible in TPE's MEMORY MAP - and that hole is
#             harmless: RetroCore has the same one and works.
[mfbus]
size      = 8
base_page = 04100B

# Memory parts, mirroring the per-part questions of
# DEFINE-MEMORY-CONFIGURATION. Access defaults to all three, so a part
# only needs its size. 4096 pages of 2K bytes is the 8 MB pool above.
[mfbus.part.0]
pages   = 4096
nd100   = yes
nd500_p = yes
nd500_d = yes


# ---------------------------------------------------------------------
# Octobus
# ---------------------------------------------------------------------
# The card answers at IOX 100400-100437 on level 13. The ND-100 is always
# station 1B, so the section's presence is the whole configuration.
[controller.octobus.0]
enabled = yes


# ---------------------------------------------------------------------
# ND-5000 CPU
# ---------------------------------------------------------------------
# <n> in [nd5000.<n>] is the CPU SLOT. The hardware has slots for
# stations 070B to 076B; a duplicate slot is an error.
[nd5000.1]
enabled = yes
station = 070B


# ---------------------------------------------------------------------
# Runtime options (non-hardware; a command-line flag overrides these)
# ---------------------------------------------------------------------
[runtime]
# telnet = 9000          ; enable telnet server on this port
# throttle = 0.5275      ; MHz real-time throttle (omit = full speed)
# debugger = 4711        ; enable DAP debugger on this port
# log = device:trace     ; per-category logging
