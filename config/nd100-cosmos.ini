# =====================================================================
# nd100-cosmos.ini - SINTRAN with COSMOS on the Ethernet II controller
# =====================================================================
# WHAT THIS MACHINE IS
#   An ND-100/CX with the MMS-2 paging system, the 48-bit floating point
#   unit and 4 MB of memory. It boots SINTRAN III from the SMD disc image
#   BIGDISK0-K-100.IMG. That SINTRAN is generated with COSMOS, Norsk
#   Data's own network software, and sets the Ethernet II card up for
#   COSMOS (IEEE 802.3 framing) when it boots; the console then reports
#   "Network server ENNS0 started". Logged in, "conn-to d102" tries to
#   reach the remote system d102 over COSMOS.
#
#   config/nd100-eth.ini is the same ND-100 and the same Ethernet card
#   booting a SINTRAN with TCP/IP from a Winchester disc instead.
#
# HOW TO RUN IT (from the repo root)
#   nd100x --config config/nd100-cosmos.ini
#   nd100x --config config/nd100-cosmos.ini --show-config   (print the
#                                              resolved machine and exit)
#
# PATHS
#   Disc image names in this file are opened relative to the directory
#   nd100x is started from, NOT relative to this file. Start from the repo
#   root, where BIGDISK0-K-100.IMG lives.
#
# HOW THIS FILE WORKS
#   * Lines starting with '#' or ';' are comments; ';' also starts a
#     comment after a value.
#   * Section names are [type.thumbwheel]. Keys are case-insensitive.
#   * A controller section with "enabled = yes" puts the card in the
#     machine; "enabled = no" leaves the section in the file but builds
#     nothing. Loading any INI starts from a machine with no controllers.
#   * A command-line flag always wins over the key here that means the
#     same thing (--eth0 over net, --telnet over telnet, and so on).
#   * Ident codes are fixed by the hardware from the thumbwheel; they are
#     never set here.
# =====================================================================


# ---------------------------------------------------------------------
# CPU / base machine
# ---------------------------------------------------------------------
# cpu  - a family number (100, 110, 120) or a model name. Model names the
#        emulator implements: ND100, ND100CE, ND100CX, ND110, ND110CE,
#        ND110CX, ND110PCX, ND120CX. Same as --cputype.
# mms  - paging system: 1 = Paging System I (4 page tables, NORD-10 era,
#        needed by NORD TSS), 2 = MMS-2 (16 page tables, needed by
#        SINTRAN VSX). Same as --mms.
# fpp  - floating point unit width: 48 (the standard 3-word format) or 32
#        (the optional single-precision unit). Same as --fpp.
# rtc  - real-time clock source, wall (default: 50 Hz of host wall-clock
#        time) or ticks (one pulse per 10550 instructions). Same as --rtc.
# The CPU, the clock and the console terminal are always present.
[machine]
cpu = ND100CX
mms = 2
fpp = 48
# rtc = wall


# ---------------------------------------------------------------------
# Disc controllers
# ---------------------------------------------------------------------
# Only thumbwheel 0 exists for floppy and SMD. A controller with no diskN
# lines is present with nothing mounted.

# Floppy (DMA controller), IOX 1560-1567. Units: disk0 to disk2.
[controller.floppy.0]
enabled = yes
# disk0 = FLOPPY.IMG

# SMD (the big disc controller), IOX 1540-1547. Units: disk0 to disk3.
# Unit 0 is the SINTRAN system pack this machine boots from.
[controller.smd.0]
enabled = yes
disk0 = BIGDISK0-K-100.IMG
# disk1 =
# disk2 =
# disk3 =


# ---------------------------------------------------------------------
# Ethernet II controller (the 68000-based card)
# ---------------------------------------------------------------------
# Thumbwheel 0 to 3. Wheel 0 answers at IOX 140360-140363 with ident
# 140034 on interrupt level 12 (wheel 1: 140364 / 140035, and so on).
#
# net   - how the card reaches a real or emulated network. Same values as
#         --eth0 (see nd100x --help):
#           none              card present, no cable
#           tap:IFNAME        a Linux TAP device (name up to 15 chars)
#           pcap:ADAPTER      an adapter via Npcap/libpcap (Windows: the
#                             ND-Loopback adapter, docs/ETHERNET.md sect. 9)
#           gateway[:SEG]     segment SEG (0-255) of a running
#                             tools/nd100-gateway (browser builds use this)
#           udp[:GROUP][:PORT], udp-mcast:...   UDP transport
#           listen[:PORT]     wait for one TCP peer
#           tcp:HOST[:PORT]   connect to one TCP peer
#         COSMOS speaks to other ND systems, so with tap:nd0 nothing on the
#         host answers it; the frames can be watched with tcpdump on nd0,
#         and a second emulator on the same segment (gateway or udp) is
#         what a COSMOS peer would be. Create nd0 once, as root:
#           ip tuntap add dev nd0 mode tap user $USER
#           ip addr add 192.168.210.1/24 dev nd0
#           ip link set nd0 up
# bank  - the DRAM window bank strap: which 128 KB bank of ND-100 memory
#         the card's 512 KB window replaces. 0-252, multiple of 4. Left
#         out, the card uses 16 + 4 * thumbwheel, so wheel 0 sits at byte
#         address 0x200000. Change it only when the ND-100 memory map
#         really has something else there.
# trace - write a differential trace of the card to this file (same as
#         --eth0-trace). Off when left out.
[controller.eth.0]
enabled = yes
net = tap:nd0
# bank = 16
# trace = eth-trace.txt


# ---------------------------------------------------------------------
# Terminals
# ---------------------------------------------------------------------
# Terminal numbers are SINTRAN's: terminal 1 is the console (IOX 300) and
# is always present, so it is not listed. Terminals 2-8 sit at IOX 310 to
# 370, terminals 9-16 at IOX 1300 to 1370. The telnet server hands out
# terminals from this list (8-11 by default); the F12 menu shows them.
[terminals]
enabled = 5, 6, 7, 8, 9, 10, 11


# ---------------------------------------------------------------------
# Peripherals
# ---------------------------------------------------------------------
# Paper tape reader (IOX 400-403), paper tape punch (IOX 410-413) and line
# printer (IOX 430-433).
# Punch output lands in [runtime] tapedir, printer output in [runtime]
# printdir.
[peripheral.papertape-reader]
enabled = yes

[peripheral.papertape-punch]
enabled = yes

[peripheral.lineprinter]
enabled = yes


# ---------------------------------------------------------------------
# Boot
# ---------------------------------------------------------------------
# device = <type>.<thumbwheel>.<unit>, so smd.0.0 is SMD unit 0 above.
# Other forms: wd.0.0, scsi.0.0, floppy.0.0, bpun:FILE (load a BPUN tape
# image into memory and start it), aout:FILE, none (power on with nothing
# loaded, for a program handed over by the debugger).
[boot]
device = smd.0.0


# ---------------------------------------------------------------------
# Runtime options (not hardware; a command-line flag overrides each)
# ---------------------------------------------------------------------
# memory   - installed main memory in MB, 1 to 16 (same as --memory).
# verbose  - on: print the device list and INFO log lines at start-up
#            (same as --verbose). Default is quiet.
# telnet   - start the telnet server on this port (same as --telnet).
# debugger - start the DAP debugger on this port (same as --debugger).
#            Use a port other than 4711 when another nd100x may be running.
# log      - per-category log levels, same syntax as --log, e.g.
#            log = eth:info
[runtime]
memory = 4
verbose = on
# telnet = 9000
# debugger = 6661
# log = eth:info
