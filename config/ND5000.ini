# =====================================================================
# ND5000.ini - ND-100 front end with an ND-5000 CPU on the octobus
# =====================================================================
# WHAT THIS MACHINE IS
#   An ND-100 that boots SINTRAN from the SMD pack ND5000.IMG and carries
#   the three pieces an ND-5000 needs: the MFbus shared memory pool, the
#   octobus card, and one ND-5000 CPU in slot 1 (station 070B). SINTRAN
#   on that pack brings the ND-5000 up; from a terminal, @ND-500 enters
#   the ND-500 monitor and ND <program> runs a program on it.
#
# HOW TO RUN IT (from the repo root)
#   nd100x --config config/ND5000.ini
#   nd100x --config config/ND5000.ini --show-config   (print the resolved
#                                                    machine and exit)
#
# PATHS
#   Disc image names in this file are opened relative to the directory
#   nd100x is started from, NOT relative to this file. Start from the repo
#   root, where ND5000.IMG lives. Disc images are not in the repository.
#
# HOW THIS FILE WORKS
#   * Lines starting with '#' or ';' are comments; ';' also starts a
#     comment after a value.
#   * Section names are [type.thumbwheel]. Keys are case-insensitive.
#   * A controller section with "enabled = yes" puts the card in the
#     machine; "enabled = no" leaves the section in the file but builds
#     nothing. Loading any INI starts from a machine with no controllers.
#   * NAMING A SECTION IS WHAT ENABLES IT for [mfbus], [controller.octobus.0]
#     and [nd5000.<n>]: the section header alone switches the hardware on,
#     so deleting or commenting out the section is how it is turned off
#     ("enabled = no" keeps the section but builds nothing). Without the
#     three sections this is a plain ND-100.
#   * A command-line flag always wins over the key here that means the
#     same thing.
#   * Ident codes are fixed by the hardware from the thumbwheel; they are
#     never set here.
#
# config/tpe.ini is the same ND-5000 machine booting the TPE diagnostic
# floppy instead of SINTRAN.
# =====================================================================


# ---------------------------------------------------------------------
# CPU / base machine
# ---------------------------------------------------------------------
# cpu  - a family number (100, 110, 120) or a model name such as ND110CX
#        (same as --cputype). Other keys: mms (1|2, the paging system),
#        fpp (32|48, floating point width), rtc (wall|ticks, clock
#        source). The CPU, the clock and the console terminal are always
#        present.
[machine]
cpu = 100


# ---------------------------------------------------------------------
# Disc controllers
# ---------------------------------------------------------------------
# Only thumbwheel 0 exists for floppy and SMD.

# SMD (the big disc controller), IOX 1540-1547. Units: disk0 to disk3.
# Unit 0 is the SINTRAN pack this machine boots; it must be a pack
# generated with ND-500 support.
[controller.smd.0]
enabled = yes
disk0 = ND5000.IMG        ; unit 0 - the SINTRAN pack this machine boots
# disk1 =
# disk2 =
# disk3 =

# Floppy (DMA controller), IOX 1560-1567. Units: disk0 to disk2.
[controller.floppy.0]
enabled = yes
disk0 = FLOPPY.IMG

# SCSI (ND-3201/3204), thumbwheels 0-3; wheel 0 is IOX 144300-144377.
# Units: disk0 to disk6 (SCSI ID 7 is the controller itself). Each disk is
# [media:]path with media = hdd | cdrom | tape | floppy; only hdd is
# implemented and it is the default when the prefix is left out.
[controller.scsi.0]
enabled = yes
disk0 = hdd:SCSI0.IMG


# ---------------------------------------------------------------------
# Terminals
# ---------------------------------------------------------------------
# Terminal numbers are SINTRAN's: terminal 1 is the console (IOX 300) and
# is always present, so it is not listed. Terminals 2-8 sit at IOX 310 to
# 370, terminals 9-16 at IOX 1300 to 1370. The telnet server hands out
# terminals from this list (8-11 by default); the F12 menu shows them.
[terminals]
enabled = 5, 6, 7, 8, 9, 10, 11


# ---------------------------------------------------------------------
# Peripherals
# ---------------------------------------------------------------------
# Paper tape reader (IOX 400-403), paper tape punch (IOX 410-413) and line
# printer (IOX 430-433). Punch output lands in [runtime] tapedir, printer
# output in [runtime] printdir.
[peripheral.papertape-reader]
enabled = yes

[peripheral.papertape-punch]
enabled = yes

[peripheral.lineprinter]
enabled = yes


# ---------------------------------------------------------------------
# Boot
# ---------------------------------------------------------------------
# device = <type>.<thumbwheel>.<unit>, so smd.0.0 is SMD unit 0 above.
# Other forms: scsi.0.0, floppy.0.0, bpun:FILE, aout:FILE, none.
[boot]
device = smd.0.0


# ---------------------------------------------------------------------
# MFbus shared memory (the MPM5 multiport memory)
# ---------------------------------------------------------------------
# The memory the ND-100 and the ND-5000 share. Naming this section adds
# it.
# size      - pool size in megabytes, 1 to 2048. A real system is the sum
#             of its RAM cards (4, 8 or 16 MB each).
# base_page - the ND-100 page (2 KB pages) at which ND-500 physical
#             address 0 lands. Octal takes a trailing B (04100B), decimal
#             takes none (2112). Give the ND-500 monitor's
#             DEFINE-MEMORY-CONFIGURATION this same number. 04100B matches
#             RetroCore, whose working MEM-CONF reports "ND-500 address
#             zero: ND-100 page 004100" and ND-100 word 00010200000B
#             (2112 * 1024). It leaves bank 32 unbacked - a 128 KB hole
#             visible in TPE's MEMORY MAP - and that hole is harmless:
#             RetroCore has the same one and works.
[mfbus]
size      = 8
base_page = 04100B

# Memory parts, one section per part, mirroring the per-part questions of
# DEFINE-MEMORY-CONFIGURATION:
# pages   - size of the part in 2 KB pages; 4096 pages is the 8 MB above.
# nd100, nd500_p, nd500_d - yes/no, the three access questions of
#             DEFINE-MEMORY-CONFIGURATION: may the ND-100 reach the part,
#             may the ND-500 reach it through its P port, through its D
#             port. All default to yes, so a part only needs its size. A
#             part with nd100 = no is memory the ND-100 cannot reach, which
#             is how a pool larger than the ND-100's 32 MB view is written.
[mfbus.part.0]
pages   = 4096
nd100   = yes
nd500_p = yes
nd500_d = yes


# ---------------------------------------------------------------------
# Octobus
# ---------------------------------------------------------------------
# The message bus between the ND-100 and the ND-5000 CPUs. Wheel 0 answers
# at IOX 100400-100407 with idents 40B (receive) and 41B (transmit) on
# interrupt level 13. The ND-100 is always station 1B, so the section's
# presence is the whole configuration. [octobus] is accepted as a short
# spelling of the section name.
[controller.octobus.0]
enabled = yes


# ---------------------------------------------------------------------
# ND-5000 CPU
# ---------------------------------------------------------------------
# <n> in [nd5000.<n>] is the CPU SLOT, 1 to 4. Each slot is one CPU on its
# own host thread, and all of them share the one [mfbus] pool.
# station  - the CPU's octobus station, octal with a trailing B. The
#            configuration allows 070B to 073B (four CPUs, as the largest
#            shipped ND-5900 had); left out, slot n gets 070B + (n - 1).
#            Two slots on one station is an error.
# Other keys, all optional: base_page (this CPU's ND-100 page for ND-500
# address 0; left out it inherits [mfbus] base_page, and on all evidence so
# far every CPU has the same value, so leave it out), cpu_type (500 or
# 5000), kernel / pseg / dseg (an NDIX a.out kernel and its two segment
# files, given together or not at all), disk0.. ([ro:|rw:]image; read-only
# unless rw: is given, because an NDIX root image is damaged by a mistake).
[nd5000.1]
enabled = yes
station = 070B

# Up to four CPUs, as in the ND-5900 (Models 2, 3 and 4 = two, three and
# four CPUs). Uncomment to add CPUs. SINTRAN uses a CPU once a terminal
# gives CHANGE-CPU n in the ND-500 monitor; whether a given pack supports
# more than one is a property of that SINTRAN.
# [nd5000.2]
# enabled = yes
# station = 071B
#
# [nd5000.3]
# enabled = yes
# station = 072B
#
# [nd5000.4]
# enabled = yes
# station = 073B


# ---------------------------------------------------------------------
# Runtime options (not hardware; a command-line flag overrides each)
# ---------------------------------------------------------------------
# telnet     - start the telnet server on this port (same as --telnet);
#              terminals 8-11 are offered to telnet clients.
# throttle   - MHz of real-time throttle (same as --throttle); 0.5275
#              makes the ticks-mode clock exactly 50 Hz. Left out = full
#              speed.
# host_cpu   - low (default): sleep when the machine is idle, little host
#              CPU. full: never sleep, one host core always busy. Same as
#              --host-cpu.
# idle_count - instructions in a row on level 0 with paging and
#              interrupts on (idle SINTRAN) before the 1 ms idle sleep.
#              Lower = less host CPU. Left out = 2000 for a disc boot,
#              50000 for floppy and directly loaded programs; 0 = off.
#              Same as --idle-count.
# debugger   - start the DAP debugger on this port (same as --debugger).
#              Use a port other than 4711 when another nd100x may be
#              running.
# log        - per-category log levels, same syntax as --log. The mms
#              category at info shows the ND-5000 mailbox traffic.
[runtime]
telnet = 9000
# throttle = 0.5275
# host_cpu = low
# idle_count = 2000
# debugger = 6661
# log = mms:info
