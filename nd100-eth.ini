# =====================================================================
# nd100-eth.ini - SINTRAN M with TCP/IP on the Ethernet II controller
# =====================================================================
# ND-100/CX, MMS-2, 48-bit FPP, 4 MB, booting SINTRAN M from the
# Winchester disc image WD0-SINTRAN-M.IMG. That SINTRAN initialises the
# Ethernet II card and runs the TCP/IP code.
#
# Run it with:
#   nd100x --config nd100-eth.ini
#
# Paths are relative to the directory nd100x is started from, which is
# normally the repository root where WD0-SINTRAN-M.IMG lives.
# =====================================================================


[machine]
cpu = ND100CX
mms = 2
fpp = 48


# ---------------------------------------------------------------------
# Disc controllers
# ---------------------------------------------------------------------

# Floppy, thumbwheel 0 (IOX 1560-1567).
[controller.floppy.0]
enabled = yes

# SMD, thumbwheel 0 (IOX 1540-1547).
[controller.smd.0]
enabled = yes

# Winchester (ST506 / 8 inch), IOX 500-507. Unit 0 holds SINTRAN M.
[controller.wd.0]
enabled = yes
disk0 = WD0-SINTRAN-M.IMG


# ---------------------------------------------------------------------
# Ethernet II controller (68000 card)
# ---------------------------------------------------------------------
# Thumbwheel 0: IOX 140360-140363, ident 140034 on level 12.
# net   - host network SPEC (same values as --eth0). No host backend
#         exists yet, so the card runs but no frames leave the machine.
# bank  - DRAM window bank strap (0-252, multiple of 4). Omitted = 16,
#         ND-100 byte address 0x200000; the card's 512 KB replaces local
#         RAM there.
# trace - differential trace file (same as --eth0-trace).
[controller.eth.0]
enabled = yes
net = none
# bank = 16
# trace = eth-trace.txt


# ---------------------------------------------------------------------
# Terminals
# ---------------------------------------------------------------------
[terminals]
enabled = 5, 6, 7, 8, 9, 10, 11


# ---------------------------------------------------------------------
# Peripherals
# ---------------------------------------------------------------------
[peripheral.papertape-reader]
enabled = yes

[peripheral.papertape-punch]
enabled = yes

[peripheral.lineprinter]
enabled = yes


# ---------------------------------------------------------------------
# Boot
# ---------------------------------------------------------------------
[boot]
device = wd.0.0


# ---------------------------------------------------------------------
# Runtime options (a command-line flag overrides these)
# ---------------------------------------------------------------------
[runtime]
memory = 4
# telnet = 9000
# debugger = 6661
